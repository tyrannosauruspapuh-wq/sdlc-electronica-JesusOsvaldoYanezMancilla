services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    healthCheckPath: /health # o la ruta de salud de su API (ej. /docs)
    buildCommand: ""
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  - name: sensorhub-db
    plan: free