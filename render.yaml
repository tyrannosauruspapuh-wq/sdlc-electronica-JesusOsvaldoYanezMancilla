services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  - name: sensorhub-db
    plan: free